<html lang="zh-CN">

            color: #0f172a;

            justify-content: center;
        }

            max-width: 1300px;

        .badge { background: #dbeafe; color: #1e40af; padding: 4px 14px; border-radius: 30px; font-size: 13px; font-weight: 600; }

        .toolbar {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
        }
        .toolbar .search-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .toolbar .search-area input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid #d1d9e6;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .toolbar .search-area input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px #bfdbfe; }
        .toolbar .search-area button {
            padding: 10px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .toolbar .search-area button:hover { background: #2563eb; }
        .toolbar .search-area button.clear { background: #e2e8f0; color: #1e293b; }
        .toolbar .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-top: 4px;
        }
        .toolbar .quick-links a {
            font-size: 13px;
            color: #1e40af;
            background: #e0e7ff;
            padding: 4px 14px;
            border-radius: 20px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .toolbar .quick-links a:hover { background: #bfdbfe; }
        .toolbar .result-info {
            font-size: 13px;
            color: #475569;
            margin-top: 8px;
            display: none;
        }
        .toolbar .result-info.show { display: block; }

        /* 术语字典表格区域 */
        .term-dict {
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            background: #fafcff;
        }
        .term-dict .header {
            background: #eef2ff;
            padding: 12px 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            user-select: none;
        }
        .term-dict .header:hover { background: #e0e7ff; }
        .term-dict .body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .term-dict .body.open { max-height: 600px; overflow-y: auto; }
        .term-dict table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .term-dict th {
            background: #f1f5f9;
            text-align: left;
            padding: 10px 16px;
            border-bottom: 2px solid #d1d9e6;
            position: sticky;
            top: 0;
            background: #f1f5f9;
            z-index: 2;
        }
        .term-dict td {
            padding: 8px 16px;
            border-bottom: 1px solid #e9edf2;
            vertical-align: top;
        }
        .term-dict .category { font-weight: 600; color: #2563eb; width: 80px; }
        .term-dict .term { font-weight: 600; color: #0f172a; width: 150px; }
        .term-dict .explanation { color: #334155; }

        /* 树样式 */
        .tree { padding-left: 0; list-style: none; }
        .tree ul { padding-left: 26px; list-style: none; border-left: 2px solid #d1d9e6; margin-left: 6px; }
        .tree li { position: relative; margin: 4px 0; }
        .node {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 5px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .node:hover { background: #f8fafc; }
        .node .toggle {
            display: inline-block;
            width: 22px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            flex-shrink: 0;
            margin-top: 3px;
            user-select: none;
            font-weight: 700;
        }
        .node .label {
            font-size: 15px;
            line-height: 1.7;
            word-break: break-word;
        }
        .node .label .tag { display: inline-block; background: #e2e8f0; padding: 0 10px; border-radius: 12px; font-size: 11px; font-weight: 600; color: #475569; margin-left: 8px; }
        .node .label code { background: #f1f5f9; padding: 2px 10px; border-radius: 6px; font-size: 13px; font-family: monospace; border: 1px solid #e2e8f0; }
        .node .label .cmd { display: inline-block; background: #0f172a; color: #e2e8f0; padding: 2px 12px; border-radius: 6px; font-size: 13px; font-family: monospace; margin: 2px 0; border: 1px solid #334155; }
        .node .label .hl { background: #fef9c3; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
        .node .label .warn { background: #fee2e2; color: #991b1b; padding: 1px 8px; border-radius: 4px; font-size: 13px; }
        .children { overflow: hidden; transition: max-height 0.3s ease; max-height: 0; }
        .children.open { max-height: 100000px; }
        .leaf .node { cursor: default; }
        .leaf .node:hover { background: transparent; }
        .leaf .node .toggle { visibility: hidden; }
        .highlight-node { background: #fef9c3 !important; border-radius: 8px; }

        .footer { margin-top: 32px; border-top: 1px solid #e2e8f0; padding-top: 18px; font-size: 13px; color: #94a3b8; text-align: center; }
        .breadcrumb { font-size: 13px; color: #64748b; margin: 8px 0 16px 0; padding: 8px 12px; background: #f8fafc; border-radius: 30px; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <h1>🌳 SRE 面试备战 · 知识树 + 术语字典</h1>
    <div class="subtitle">
        <span>点击 ▶ 展开知识点 · 搜索 · 快捷定位面试题</span>
        <span class="badge">腾讯游戏运维 · 技术一面</span>
    </div>

    <!-- 工具条 -->
    <div class="toolbar">
        <div class="search-area">
            <input type="text" id="searchInput" placeholder="搜索知识点（如 load average, pod, 安全组）" />
            <button id="searchBtn">🔍 搜索</button>
            <button class="clear" id="clearBtn">✕ 清空</button>
        </div>
        <div class="quick-links">
            <!-- 针对面试问题的快捷链接 -->
            <a data-target="linux-slow">🐧 Linux 缓慢排查</a>
            <a data-target="pod-crash">🧩 Pod CrashLoopBackOff</a>
            <a data-target="dns-issue">🌐 域名无法访问</a>
            <a data-target="cpu-high">🔥 CPU 95% 处理</a>
            <a data-target="api-timeout">⏱️ API 超时情境</a>
            <a data-target="dictionary">📚 术语字典</a>
        </div>
        <div id="resultInfo" class="result-info"></div>
    </div>

    <!-- 术语字典表格（默认收起） -->
    <div class="term-dict" id="termDict">
        <div class="header" onclick="toggleDict()">
            <span>📘 排障术语速查表（点击展开/收起）</span>
            <span>▼</span>
        </div>
        <div class="body" id="dictBody">
            <table>
                <thead><tr><th>术语</th><th>类别</th><th>解释</th></tr></thead>
                <tbody id="dictTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 树容器 -->
    <ul class="tree" id="knowledgeTree"></ul>

    <div class="footer">
        ⚡ 点击快捷链接自动展开对应节点 · 搜索支持模糊匹配
    </div>
</div>

<script>
// ============================================================
// 1. 术语字典数据
// ============================================================
var dictData = [
    // Linux 指标
    { term: "%wa", category: "Linux", explanation: "CPU 等待 I/O 的时间占比。>10% 表示磁盘或网络 I/O 瓶颈。" },
    { term: "%id", category: "Linux", explanation: "CPU 空闲率。若低且 %us 高则 CPU 繁忙；若低且 %wa 高则 I/O 慢。" },
    { term: "%us", category: "Linux", explanation: "用户态 CPU 占用（应用程序逻辑）。" },
    { term: "%sy", category: "Linux", explanation: "内核态 CPU 占用（系统调用、中断、调度）。" },
    { term: "%ni", category: "Linux", explanation: "nice 值调整过的进程占用的 CPU 时间。" },
    { term: "load average", category: "Linux", explanation: "1/5/15 分钟平均活跃进程数（含 R 和 D 状态）。反映系统拥堵程度。" },
    { term: "r (vmstat)", category: "Linux", explanation: "运行队列中等待 CPU 的进程数。> 核数 即超载。" },
    { term: "b (vmstat)", category: "Linux", explanation: "阻塞在 I/O 的进程数（D 状态）。>0 表示 I/O 或锁竞争严重。" },
    { term: "si / so", category: "Linux", explanation: "Swap In/Out（交换分区读写）。一旦持续跳动 → 物理内存耗尽，性能崩溃。" },
    { term: "%util (iostat)", category: "Linux", explanation: "磁盘繁忙度（工作时间占比）。接近 100% 表示磁盘打爆。" },
    { term: "await (iostat)", category: "Linux", explanation: "平均每次 I/O 请求等待时间（含排队+服务）。>20ms（机械盘）即慢。" },
    { term: "Recv-Q (ss)", category: "Linux", explanation: "已收到但未被应用程序读取的字节数。堆积 → 应用处理不过来。" },
    { term: "Send-Q (ss)", category: "Linux", explanation: "已发送但未被对方确认的字节数。堆积 → 网络拥塞或对端窗口关闭。" },
    { term: "available 内存", category: "Linux", explanation: "可用于新进程的物理内存（含可回收的 cache）。查看可用内存的最佳指标。" },
    { term: "OOM (Out of Memory)", category: "Linux", explanation: "内存耗尽，内核触发 OOM Killer 强制杀进程。查看 dmesg 可确认。" },
    { term: "硬件错误", category: "Linux", explanation: "dmesg 中可见的 PCIe、磁盘、内存 ECC 错误，需更换硬件。" },
    { term: "iotop", category: "Linux", explanation: "实时查看各进程 I/O 读写速率，定位 I/O 占用大户。" },
    { term: "内存泄漏", category: "Linux", explanation: "进程分配内存后未释放，导致可用内存持续下降。用 top 观察 RES 持续增长。" },
    { term: "strace / perf", category: "Linux", explanation: "strace 追踪系统调用；perf 进行 CPU 性能分析（采样、热点函数）。" },
    { term: "限流 (rate limit)", category: "Linux", explanation: "限制单位时间内的请求量，防止服务过载。Nginx limit_req / Sentinel 实现。" },
    { term: "熔断 (circuit breaker)", category: "Linux", explanation: "当错误率或延迟超过阈值，自动拒绝请求，防止级联故障。Hystrix / Resilience4j。" },
    { term: "自动弹性伸缩 (HPA)", category: "K8s", explanation: "Horizontal Pod Autoscaler，根据 CPU/内存或自定义指标自动调整 Pod 副本数。" },
    // K8s 术语
    { term: "ConfigMap / Secret", category: "K8s", explanation: "ConfigMap 存储非敏感配置；Secret 存储敏感信息（密码、证书），编码为 base64。" },
    { term: "requests / limits", category: "K8s", explanation: "requests 为调度预留资源；limits 为容器最大可用资源。过低的 limits 会导致 OOMKilled。" },
    { term: "扩容节点", category: "K8s", explanation: "当节点资源不足时，增加 Node 数量（云上 Cluster Autoscaler 或手动添加 CVM）。" },
    { term: "initContainer", category: "K8s", explanation: "在业务容器启动前运行的初始化容器，常用于等待依赖服务就绪或执行预处理。" },
    { term: "readinessProbe", category: "K8s", explanation: "就绪探针，指示容器是否可以接收流量。失败则从 Service 的 Endpoints 中移除。" },
    { term: "livenessProbe", category: "K8s", explanation: "存活探针，检测容器是否存活。失败则 kubelet 会重启容器。" },
    { term: "PodDisruptionBudget", category: "K8s", explanation: "保证在自愿中断（如节点升级）时，至少保持指定数量的 Pod 可用，防止服务全挂。" },
    { term: "Alert Fatigue", category: "监控", explanation: "告警疲劳：大量无效告警导致运维麻木。解决：分级、聚合、基于 SLO 设计告警。" }
];

// ============================================================
// 2. 树数据（增强版：增加 K8s 排障分支 + 原理深挖节点）
// ============================================================
var treeData = [
    // 术语字典不放在树中，单独展示，所以树数据不再包含字典
    {
        id: "linux-root",
        label: "🐧 Linux 系统运维与排障",
        children: [
            {
                id: "sys-obs",
                label: "1. 系统状态观测层",
                children: [
                    {
                        id: "top",
                        label: "📊 top（全局概览）",
                        children: [
                            { id: "top-load", label: "<strong>load average</strong>：1/5/15分钟平均活跃进程数（含运行态 + 不可中断睡眠）。" },
                            { id: "top-load-not-cpu", label: "⚠️ <span class=\"hl\">load ≠ CPU%</span>。例：单核CPU load=1.0 即满载，load=5.0 表示严重拥堵。" },
                            { id: "top-us", label: "<strong>%us</strong>：用户态CPU（应用程序逻辑）。" },
                            { id: "top-sy", label: "<strong>%sy</strong>：内核态CPU（系统调用、中断、I/O调度）。" },
                            { id: "top-id", label: "<strong>%id</strong>：空闲CPU。" },
                            { id: "top-wa", label: "<span class=\"hl\">%wa</span>：CPU等待I/O的时间占比。>10% 即存在磁盘或网络I/O瓶颈。" },
                            { id: "top-decision", label: "决策树：%wa高 → 看磁盘；%sy高且%id低 → 内核忙，切 <code>vmstat</code> 看上下文切换。" },
                            { id: "top-interact", label: "交互快捷键：<code>P</code> 按CPU排序，<code>M</code> 按内存，<code>k</code> 杀进程，<code>r</code> 调整nice。" },
                            { id: "top-cmd", label: "实战：<code>top -c</code> 显示完整命令行，<code>top -u user</code> 只看某用户。" },
                            // 原理深挖
                            { id: "top-load-why", label: "⚙️ <strong>为什么 load average 包含 D 状态？</strong> D 状态进程处于不可中断睡眠（等待 I/O），它们虽未占用 CPU，但仍计入系统负载，因为系统无法处理更多请求，直到 I/O 完成。" }
                        ]
                    },
                    {
                        id: "vmstat",
                        label: "📈 vmstat 1（内核调度与内存）",
                        children: [
                            { id: "vmstat-r", label: "<strong>r（运行队列）</strong>：正在排队等待CPU的进程数。> CPU核数 = 超载。" },
                            { id: "vmstat-b", label: "<strong>b（阻塞进程）</strong>：处于不可中断睡眠(D态)的进程数。>0 说明I/O或锁竞争严重。" },
                            { id: "vmstat-si-so", label: "<strong>si / so（交换分区换入/换出）</strong>：一旦 >0 且持续跳动 = <span class=\"warn\">物理内存耗尽，硬盘当内存用，性能雪崩</span>。" },
                            { id: "vmstat-cs", label: "<strong>cs（上下文切换）</strong>：每秒切换次数。过高（如>50万）可能因网卡中断暴增。" },
                            { id: "vmstat-in", label: "<strong>in（中断）</strong>：设备中断频率，过高可能网卡/磁盘硬件问题。" },
                            { id: "vmstat-us-sy", label: "<strong>us/sy/id/wa</strong>：与top对应，综合判断。" },
                            { id: "vmstat-cmd", label: "实战：<code>vmstat 1 5</code> 每隔1秒输出，共5次。" },
                            { id: "vmstat-si-so-why", label: "⚙️ <strong>为什么 si/so 出现说明内存不足？</strong> 当物理内存耗尽时，内核将不活跃的内存页换出到 swap 分区（so），需要时再换入（si）。磁盘速度比内存慢千倍，导致系统急剧变慢。" }
                        ]
                    },
                    {
                        id: "iostat",
                        label: "💾 iostat -x 1（磁盘I/O细节）",
                        children: [
                            { id: "iostat-util", label: "<strong>%util</strong>：磁盘繁忙度（相当于磁盘工作时间占比）。接近100% = <span class=\"hl\">磁盘打爆</span>。" },
                            { id: "iostat-await", label: "<strong>await</strong>：平均每次I/O请求的等待时间（含排队+服务）。 > 20ms（机械盘）即慢，云硬盘 > 5ms 需关注。" },
                            { id: "iostat-rw", label: "<strong>r/s, w/s</strong>：每秒读写次数。" },
                            { id: "iostat-kB", label: "<strong>rkB/s, wkB/s</strong>：读写速率。" },
                            { id: "iostat-cmd", label: "命令：<code>iostat -x 1</code>（-x 扩展模式，1秒刷新）。" },
                            { id: "iostat-decision", label: "关联：若 %util 100% 且 await 极高，基本断定是磁盘瓶颈，优先查慢SQL或日志刷盘。" }
                        ]
                    },
                    {
                        id: "ss",
                        label: "🌐 ss -tlnp（网络与连接状态）",
                        children: [
                            { id: "ss-vs-netstat", label: "⭐ <code>ss</code> 比 <code>netstat</code> 快得多：<code>ss</code> 直接读内核 <code>netlink</code>，<code>netstat</code> 遍历 <code>/proc/net</code>（慢）。" },
                            { id: "ss-recvq", label: "<strong>Recv-Q</strong>：已收到但未被应用程序读取的字节数。堆积 = 应用处理不过来（线程池满/代码卡顿）。" },
                            { id: "ss-sendq", label: "<strong>Send-Q</strong>：已发送但未被对方确认的字节数。堆积 = 网络拥塞或对端接收窗口关闭。" },
                            { id: "ss-states", label: "常用状态：<code>ESTAB</code>（正常连接），<code>CLOSE_WAIT</code>（对方关闭，本机未关闭）过多可能泄漏，<code>TIME_WAIT</code> 过多可调整 <code>net.ipv4.tcp_tw_reuse</code>。" },

                            { id: "ss-count", label: "排查：<code>ss -ant | grep -c CLOSE_WAIT</code> 统计异常连接数量。" },
                            { id: "ss-recvq-why", label: "⚙️ <strong>Recv-Q 堆积原理</strong>：数据已到达内核缓冲区，但应用层未调用 <code>read()</code> 取走。原因可能是线程阻塞、GC 停顿或代码处理慢。" }
                        ]
                    }
                ]
            },
            {
                id: "filesystem",
                label: "2. 文件系统与存储",
                children: [
                    {
                        id: "inode",
                        label: "📁 Inode 原理（数据的户口本）",
                        children: [
                            { id: "inode-basic", label: "文件名 = 标签；数据实体 = Inode（记录大小/权限/物理块位置）。" },
                            { id: "inode-rm", label: "<code>rm</code> 操作：撕掉目录中的文件名标签，Inode 引用计数 -1。" },

                        children: [
                            { id: "latency", label: "<strong>延迟（Latency）</strong>：P99 响应时间（玩家点击到返回）。" },
                            { id: "errors", label: "<strong>错误率（Errors）</strong>：HTTP 5xx 率、业务返回码失败率。" },
                            { id: "saturation", label: "<strong>饱和度（Saturation）</strong>：连接队列（Recv-Q）、线程池使用率。" },
                            { id: "dont-just-top", label: "切忌只看 <code>top</code>！<br>例：即使CPU只有10%，若 <code>Recv-Q</code> 堆积，玩家照样卡。" }
                        ]
                    }
                ]
            }
        ]
    }
];

// ============================================================
// 3. 渲染树 + 节点映射
// ============================================================
var nodeMap = {};
var nodePath = {};

function renderTree(data, parentUl, parentIds) {
    parentIds = parentIds || [];
    data.forEach(function(item) {
        var li = document.createElement("li");
        li.dataset.id = item.id;
        var div = document.createElement("div");
        div.className = "node";

        var hasChildren = item.children && item.children.length > 0;

        var toggle = document.createElement("span");
        toggle.className = "toggle";
        toggle.textContent = hasChildren ? "▶" : "•";
        div.appendChild(toggle);

        var labelSpan = document.createElement("span");
        labelSpan.className = "label";
        labelSpan.innerHTML = item.label;
        div.appendChild(labelSpan);

        li.appendChild(div);

        nodeMap[item.id] = li;
        nodePath[item.id] = parentIds.concat(item.id);

        if (hasChildren) {
            var childUl = document.createElement("ul");
            childUl.className = "children";
            renderTree(item.children, childUl, nodePath[item.id]);
            li.appendChild(childUl);

            div.style.cursor = "pointer";
            div.addEventListener("click", function(e) {
                e.stopPropagation();
                var childContainer = this.parentElement.querySelector("ul.children");
                if (childContainer) {
                    childContainer.classList.toggle("open");
                    var toggleIcon = this.querySelector(".toggle");
                    toggleIcon.textContent = childContainer.classList.contains("open") ? "▼" : "▶";
                }
            });
        } else {
            li.classList.add("leaf");
        }

        parentUl.appendChild(li);
    });
}

function expandToNode(nodeId) {
    var path = nodePath[nodeId];
    if (!path) return false;
    path.forEach(function(id) {
        var li = nodeMap[id];
        if (!li) return;
        var childUl = li.querySelector("ul.children");
        if (childUl) {
            childUl.classList.add("open");
            var toggle = li.querySelector(".node .toggle");
            if (toggle) toggle.textContent = "▼";
        }
    });
    var targetLi = nodeMap[nodeId];
    if (targetLi) {
        targetLi.scrollIntoView({ behavior: "smooth", block: "center" });
        targetLi.classList.add("highlight-node");
        setTimeout(function() {
            targetLi.classList.remove("highlight-node");
        }, 3000);
    }
    return true;
}

function searchNodes(query) {
    query = query.trim().toLowerCase();
    var resultInfo = document.getElementById("resultInfo");
    if (!query) {
        resultInfo.classList.remove("show");
        return;
    }
    var matches = [];
    for (var id in nodeMap) {
        var li = nodeMap[id];
        var text = li.textContent.toLowerCase();
        if (text.includes(query)) {
            matches.push(id);
        }
    }
    if (matches.length === 0) {
        resultInfo.textContent = "❌ 未找到包含 \"" + query + "\" 的节点";
        resultInfo.classList.add("show");
        return;
    }
    resultInfo.textContent = "✅ 找到 " + matches.length + " 个匹配节点，已展开第一个。";
    resultInfo.classList.add("show");
    expandToNode(matches[0]);
}

// ============================================================
// 4. 术语字典表格渲染
// ============================================================
function renderDict() {
    var tbody = document.getElementById("dictTableBody");
    tbody.innerHTML = "";
    dictData.forEach(function(row) {
        var tr = document.createElement("tr");
        tr.innerHTML = `<td class="term">${row.term}</td><td class="category">${row.category}</td><td class="explanation">${row.explanation}</td>`;
        tbody.appendChild(tr);
    });
}

function toggleDict() {
    var body = document.getElementById("dictBody");
    body.classList.toggle("open");
    var header = document.querySelector(".term-dict .header span:last-child");
    header.textContent = body.classList.contains("open") ? "▲" : "▼";
}

// ============================================================
// 5. 启动
// ============================================================
document.addEventListener("DOMContentLoaded", function() {
    var rootUl = document.getElementById("knowledgeTree");
    renderTree(treeData, rootUl);

    // 默认展开第一层
    document.querySelectorAll("#knowledgeTree > li > ul.children").forEach(function(ul) {
        ul.classList.add("open");
        var toggle = ul.parentElement.querySelector(".node .toggle");
        if (toggle) toggle.textContent = "▼";
    });

    // 渲染术语字典
    renderDict();

    // 搜索事件
    var searchInput = document.getElementById("searchInput");
    var searchBtn = document.getElementById("searchBtn");
    var clearBtn = document.getElementById("clearBtn");

    function doSearch() {
        searchNodes(searchInput.value);
    }

    searchBtn.addEventListener("click", doSearch);
    searchInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") doSearch();
    });
    clearBtn.addEventListener("click", function() {
        searchInput.value = "";
        document.getElementById("resultInfo").classList.remove("show");
        document.querySelectorAll(".highlight-node").forEach(function(el) {
            el.classList.remove("highlight-node");
        });
    });

    // 快捷链接映射
    var quickMap = {
        "linux-slow": "top",              // Linux缓慢排查 -> top
        "pod-crash": "pod-crash",         // Pod故障 -> pod-crash
        "dns-issue": "ss",               // 域名无法访问 -> ss (关联网络)
        "cpu-high": "top",               // CPU高 -> top
        "api-timeout": "latency",        // API超时 -> latency (玩家视角)
        "dictionary": "dictionary"       // 术语字典 -> 显示表格
    };

    document.querySelectorAll(".quick-links a").forEach(function(link) {
        link.addEventListener("click", function(e) {
            e.preventDefault();
            var targetId = this.dataset.target;
            if (targetId === "dictionary") {
                // 展开术语字典
                var body = document.getElementById("dictBody");
                var isOpen = body.classList.contains("open");
                if (!isOpen) toggleDict();
                document.getElementById("dictBody").scrollIntoView({ behavior: "smooth", block: "start" });
                return;
            }
            var nodeId = quickMap[targetId];
            if (nodeId && nodeMap[nodeId]) {
                expandToNode(nodeId);
                searchInput.value = "🔗 快速定位: " + this.textContent;
                document.getElementById("resultInfo").textContent = "已展开节点: " + this.textContent;
                document.getElementById("resultInfo").classList.add("show");
            } else {
                alert("未找到对应节点，请尝试搜索");
            }
        });
    });
});
</script>
