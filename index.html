<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRE 知识树 + 问题引导</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
        }
        h1 { font-size: 28px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
        .subtitle { color: #475569; font-size: 14px; border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; flex-wrap: wrap; }
        .badge { background: #dbeafe; color: #1e40af; padding: 4px 14px; border-radius: 30px; font-size: 13px; font-weight: 600; }

        /* --- 引导工具栏 --- */
        .toolbar {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }
        .toolbar .search-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .toolbar .search-area input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid #d1d9e6;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .toolbar .search-area input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px #bfdbfe; }
        .toolbar .search-area button {
            padding: 10px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .toolbar .search-area button:hover { background: #2563eb; }
        .toolbar .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-top: 4px;
        }
        .toolbar .quick-links a {
            font-size: 13px;
            color: #1e40af;
            background: #e0e7ff;
            padding: 4px 14px;
            border-radius: 20px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .toolbar .quick-links a:hover { background: #bfdbfe; }
        .toolbar .result-info {
            font-size: 13px;
            color: #475569;
            margin-top: 8px;
            display: none;
        }
        .toolbar .result-info.show { display: block; }

        /* --- 树样式（同前） --- */
        .tree { padding-left: 0; list-style: none; }
        .tree ul { padding-left: 26px; list-style: none; border-left: 2px solid #d1d9e6; margin-left: 6px; }
        .tree li { position: relative; margin: 4px 0; }
        .node {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 5px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .node:hover { background: #f8fafc; }
        .node .toggle {
            display: inline-block;
            width: 22px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            flex-shrink: 0;
            margin-top: 3px;
            user-select: none;
            font-weight: 700;
        }
        .node .label {
            font-size: 15px;
            line-height: 1.7;
            word-break: break-word;
        }
        .node .label .tag { display: inline-block; background: #e2e8f0; padding: 0 10px; border-radius: 12px; font-size: 11px; font-weight: 600; color: #475569; margin-left: 8px; }
        .node .label code { background: #f1f5f9; padding: 2px 10px; border-radius: 6px; font-size: 13px; font-family: monospace; border: 1px solid #e2e8f0; }
        .node .label .cmd { display: inline-block; background: #0f172a; color: #e2e8f0; padding: 2px 12px; border-radius: 6px; font-size: 13px; font-family: monospace; margin: 2px 0; border: 1px solid #334155; }
        .node .label .hl { background: #fef9c3; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
        .node .label .warn { background: #fee2e2; color: #991b1b; padding: 1px 8px; border-radius: 4px; font-size: 13px; }
        .children { overflow: hidden; transition: max-height 0.3s ease; max-height: 0; }
        .children.open { max-height: 100000px; }
        .leaf .node { cursor: default; }
        .leaf .node:hover { background: transparent; }
        .leaf .node .toggle { visibility: hidden; }
        .highlight-node { background: #fef9c3 !important; border-radius: 8px; }

        .footer { margin-top: 32px; border-top: 1px solid #e2e8f0; padding-top: 18px; font-size: 13px; color: #94a3b8; text-align: center; }
        .breadcrumb { font-size: 13px; color: #64748b; margin: 8px 0 16px 0; padding: 8px 12px; background: #f8fafc; border-radius: 30px; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <h1>🌳 SRE 超细粒度知识树</h1>
    <div class="subtitle">
        <span>点击 ▶ 展开底层原理与指令 · 可搜索 · 可引导</span>
        <span class="badge">RedHat / 腾讯云面试</span>
    </div>

    <!-- 工具条：快速提问 + 搜索 -->
    <div class="toolbar">
        <div class="search-area">
            <input type="text" id="searchInput" placeholder="输入关键词搜索节点（如 lsof, 安全组, 灰度）" />
            <button id="searchBtn">🔍 搜索</button>
            <button id="clearBtn" style="background:#e2e8f0;color:#1e293b;">✕ 清空</button>
        </div>
        <div class="quick-links">
            <a data-target="load-high">⚡ Load高但CPU低</a>
            <a data-target="df-du-mismatch">💾 df满但du小</a>
            <a data-target="fstab-emergency">🚑 fstab修复</a>
            <a data-target="ss-recvq">🌐 Recv-Q堆积</a>
            <a data-target="d-state">🧬 D态进程</a>
            <a data-target="shell-safe">🛡️ Shell安全</a>
            <a data-target="security-group">🔐 安全组顺序</a>
            <a data-target="cos-rclone">🪣 COS上传</a>
            <a data-target="cache-breakdown">🚦 缓存击穿</a>
            <a data-target="gray-release">🔄 灰度发布</a>
        </div>
        <div id="resultInfo" class="result-info"></div>
    </div>

    <!-- 树容器 -->
    <ul class="tree" id="knowledgeTree"></ul>

    <div class="footer">
        ⚡ 点击“快速提问”自动展开对应节点 · 搜索支持模糊匹配
    </div>
</div>

<script>
// ============================================================
// 1. 超细粒度数据（全部 QnA 知识点）
//    为支持搜索和引导，给每个节点增加一个唯一的 data-id
// ============================================================
var treeData = [
    {
        id: "linux-root",
        label: "🐧 Linux 系统运维与排障",
        children: [
            {
                id: "sys-obs",
                label: "1. 系统状态观测层",
                children: [
                    {
                        id: "top",
                        label: "📊 top（全局概览）",
                        children: [
                            { id: "top-load", label: "<strong>load average</strong>：1/5/15分钟平均活跃进程数（含运行态 + 不可中断睡眠）。" },
                            { id: "top-load-not-cpu", label: "⚠️ <span class=\"hl\">load ≠ CPU%</span>。例：单核CPU load=1.0 即满载，load=5.0 表示严重拥堵。" },
                            { id: "top-us", label: "<strong>%us</strong>：用户态CPU（应用程序逻辑）。" },
                            { id: "top-sy", label: "<strong>%sy</strong>：内核态CPU（系统调用、中断、I/O调度）。" },
                            { id: "top-id", label: "<strong>%id</strong>：空闲CPU。" },
                            { id: "top-wa", label: "<span class=\"hl\">%wa</span>：CPU等待I/O的时间占比。>10% 即存在磁盘或网络I/O瓶颈。" },
                            { id: "top-decision", label: "决策树：%wa高 → 看磁盘；%sy高且%id低 → 内核忙，切 <code>vmstat</code> 看上下文切换。" },
                            { id: "top-interact", label: "交互快捷键：<code>P</code> 按CPU排序，<code>M</code> 按内存，<code>k</code> 杀进程，<code>r</code> 调整nice。" },
                            { id: "top-cmd", label: "实战：<code>top -c</code> 显示完整命令行，<code>top -u user</code> 只看某用户。" }
                        ]
                    },
                    {
                        id: "vmstat",
                        label: "📈 vmstat 1（内核调度与内存）",
                        children: [
                            { id: "vmstat-r", label: "<strong>r（运行队列）</strong>：正在排队等待CPU的进程数。> CPU核数 = 超载。" },
                            { id: "vmstat-b", label: "<strong>b（阻塞进程）</strong>：处于不可中断睡眠(D态)的进程数。>0 说明I/O或锁竞争严重。" },
                            { id: "vmstat-si-so", label: "<strong>si / so（交换分区换入/换出）</strong>：一旦 >0 且持续跳动 = <span class=\"warn\">物理内存耗尽，硬盘当内存用，性能雪崩</span>。" },
                            { id: "vmstat-cs", label: "<strong>cs（上下文切换）</strong>：每秒切换次数。过高（如>50万）可能因网卡中断暴增。" },
                            { id: "vmstat-in", label: "<strong>in（中断）</strong>：设备中断频率，过高可能网卡/磁盘硬件问题。" },
                            { id: "vmstat-us-sy", label: "<strong>us/sy/id/wa</strong>：与top对应，综合判断。" },
                            { id: "vmstat-cmd", label: "实战：<code>vmstat 1 5</code> 每隔1秒输出，共5次。" }
                        ]
                    },
                    {
                        id: "iostat",
                        label: "💾 iostat -x 1（磁盘I/O细节）",
                        children: [
                            { id: "iostat-util", label: "<strong>%util</strong>：磁盘繁忙度（相当于磁盘工作时间占比）。接近100% = <span class=\"hl\">磁盘打爆</span>。" },
                            { id: "iostat-await", label: "<strong>await</strong>：平均每次I/O请求的等待时间（含排队+服务）。 > 20ms（机械盘）即慢，云硬盘 > 5ms 需关注。" },
                            { id: "iostat-rw", label: "<strong>r/s, w/s</strong>：每秒读写次数。" },
                            { id: "iostat-kB", label: "<strong>rkB/s, wkB/s</strong>：读写速率。" },
                            { id: "iostat-cmd", label: "命令：<code>iostat -x 1</code>（-x 扩展模式，1秒刷新）。" },
                            { id: "iostat-decision", label: "关联：若 %util 100% 且 await 极高，基本断定是磁盘瓶颈，优先查慢SQL或日志刷盘。" }
                        ]
                    },
                    {
                        id: "ss",
                        label: "🌐 ss -tlnp（网络与连接状态）",
                        children: [
                            { id: "ss-vs-netstat", label: "⭐ <code>ss</code> 比 <code>netstat</code> 快得多：<code>ss</code> 直接读内核 <code>netlink</code>，<code>netstat</code> 遍历 <code>/proc/net</code>（慢）。" },
                            { id: "ss-recvq", label: "<strong>Recv-Q</strong>：已收到但未被应用程序读取的字节数。堆积 = 应用处理不过来（线程池满/代码卡顿）。" },
                            { id: "ss-sendq", label: "<strong>Send-Q</strong>：已发送但未被对方确认的字节数。堆积 = 网络拥塞或对端接收窗口关闭。" },
                            { id: "ss-states", label: "常用状态：<code>ESTAB</code>（正常连接），<code>CLOSE_WAIT</code>（对方关闭，本机未关闭）过多可能泄漏，<code>TIME_WAIT</code> 过多可调整 <code>net.ipv4.tcp_tw_reuse</code>。" },
                            { id: "ss-params", label: "常用参数：<code>-t</code> TCP, <code>-l</code> 监听, <code>-n</code> 数字显示, <code>-p</code> 显示进程PID。" },
                            { id: "ss-count", label: "排查：<code>ss -ant | grep -c CLOSE_WAIT</code> 统计异常连接数量。" }
                        ]
                    }
                ]
            },
            {
                id: "filesystem",
                label: "2. 文件系统与存储",
                children: [
                    {
                        id: "inode",
                        label: "📁 Inode 原理（数据的户口本）",
                        children: [
                            { id: "inode-basic", label: "文件名 = 标签；数据实体 = Inode（记录大小/权限/物理块位置）。" },
                            { id: "inode-rm", label: "<code>rm</code> 操作：撕掉目录中的文件名标签，Inode 引用计数 -1。" },
                            { id: "inode-hardlink", label: "<strong>硬链接</strong>：同一个 Inode 贴多个标签。不能跨分区，不能指向目录。删除源文件，数据仍在（引用计数 >0）。" },
                            { id: "inode-softlink", label: "<strong>软链接</strong>：新建 Inode，内容存“源文件路径”。可跨分区，可指目录。删除源文件即断链（<span class=\"hl\">生产环境首选</span>）。" },
                            { id: "inode-cmd", label: "命令：<code>ln</code> 硬链接，<code>ln -s</code> 软链接。查看inode：<code>ls -li</code>。" }
                        ]
                    },
                    {
                        id: "lsof-deleted",
                        label: "🕵️ 磁盘空间失踪案（df满但du小）",
                        children: [
                            { id: "lsof-deleted-reason", label: "根本原因：大文件被 <code>rm</code>，但进程仍打开句柄（未释放）。" },
                            { id: "lsof-deleted-find", label: "查案：<code class=\"cmd\">lsof | grep deleted</code> 找出幽灵文件及PID。" },
                            { id: "lsof-deleted-fix", label: "急救：<code class=\"cmd\">echo > /proc/[PID]/fd/[FD号]</code> 清空文件（若应用支持动态重开） 或 直接重启进程。" },
                            { id: "lsof-deleted-java", label: "⚠️ 注意：不推荐直接清空 Java 正在写的日志句柄（会破坏 BufferedWriter 偏移量），尽量发 <code>kill -USR1</code> 让应用重开日志。" }
                        ]
                    },
                    {
                        id: "fstab-emergency",
                        label: "🚑 紧急救援模式（fstab 写错）",
                        children: [
                            { id: "fstab-emergency-basic", label: "系统启动进入 Emergency Mode / Rescue Mode。" },
                            { id: "fstab-emergency-steps", label: "施救流程：" },
                            { id: "fstab-emergency-step1", label: "1. 查看挂载状态，根目录默认只读(ro)。" },
                            { id: "fstab-emergency-step2", label: "2. <code class=\"cmd\">mount -o remount,rw /</code> 获取写权限。" },
                            { id: "fstab-emergency-step3", label: "3. <code>vi /etc/fstab</code> 注释掉错误行或修正UUID。" },
                            { id: "fstab-emergency-step4", label: "4. <code>reboot</code> 重启。" },
                            { id: "fstab-emergency-grub", label: "进阶：GRUB2 启动时按 <code>e</code> 编辑，在 <code>linux</code> 行加 <code>rd.break</code>，可绕过密码直接进入救援Shell（物理机/控制台权限 = 神）。" }
                        ]
                    }
                ]
            },
            {
                id: "process-state",
                label: "3. 进程与内核状态",
                children: [
                    {
                        id: "ps-states",
                        label: "🧬 ps 进程状态全解",
                        children: [
                            { id: "ps-R", label: "<strong>R</strong> (Running/Runnable)：运行或排队。" },
                            { id: "ps-S", label: "<strong>S</strong> (Sleeping)：可中断睡眠（等待事件）。" },
                            { id: "ps-D", label: "<span class=\"hl\">D</span> (Disk Sleep)：不可中断睡眠（<strong>等待I/O</strong>）。<span class=\"warn\">kill -9 杀不死</span>，必须修复底层存储或重启宿主机。" },
                            { id: "ps-T", label: "<strong>T</strong> (Stopped)：暂停（Ctrl+Z 或调试）。" },
                            { id: "ps-Z", label: "<strong>Z</strong> (Zombie)：僵尸（子进程退出，父进程未回收）。占用进程表但不占CPU。" },
                            { id: "ps-I", label: "<strong>I</strong> (Idle)：空闲内核线程。" },
                            { id: "ps-cmd", label: "排查：<code class=\"cmd\">ps aux | grep D</code> 快速揪出I/O瓶颈进程。" },
                            { id: "ps-ext", label: "扩展：<code>ps -eo state,pid,cmd | grep ^D</code> 只显示D态进程。" }
                        ]
                    }
                ]
            },
            {
                id: "shell-auto",
                label: "4. Shell 脚本与自动化",
                children: [
                    {
                        id: "shell-set",
                        label: "🛡️ 调试与安全（set 家族）",
                        children: [
                            { id: "shell-set-x", label: "<code class=\"cmd\">set -x</code>：打印每行执行的命令及参数（调试利器）。" },
                            { id: "shell-set-e", label: "<code class=\"cmd\">set -e</code>：任何命令失败（返回非0）立即退出脚本。" },
                            { id: "shell-set-u", label: "<code class=\"cmd\">set -u</code>：引用未定义变量时报错退出（防 <code>rm -rf $DIR</code> 删根目录）。" },
                            { id: "shell-set-pipefail", label: "<code class=\"cmd\">set -o pipefail</code>：管道中任何一段失败，整体返回失败（默认只看最后一段）。" },
                            { id: "shell-set-standard", label: "生产标配：<code class=\"cmd\">set -euo pipefail</code>" },
                            { id: "shell-set-trap", label: "替代调试：<code>trap 'echo \"Line: $LINENO, RC: $?\"' ERR</code> 捕捉错误行号（不泄露命令）。" },
                            { id: "shell-set-signal", label: "信号捕获：<code>trap \"cleanup\" EXIT</code> 脚本退出时执行清理。" }
                        ]
                    },
                    {
                        id: "shell-batch",
                        label: "🔄 批量操作与权限",
                        children: [
                            { id: "shell-batch-loop", label: "批量修改：<code>for ip in $(cat hosts.txt); do ssh $ip \"cmd\"; done</code>" },
                            { id: "shell-batch-backup", label: "<span class=\"warn\">务必先备份</span>：<code>cp /etc/hosts /etc/hosts.bak</code>" },
                            { id: "shell-batch-sudo", label: "非root执行mount：在 <code>/etc/sudoers</code> 限制具体命令 <code>user ALL=(ALL) NOPASSWD: /usr/bin/mount</code>，不开放全部权限。" },
                            { id: "shell-batch-gray", label: "灰度思维：先改10台，观察 <code>vmstat</code> 的 <code>si/so</code>，5分钟后再扩。" }
                        ]
                    },
                    {
                        id: "shell-background",
                        label: "⏳ 后台保活与输出控制",
                        children: [
                            { id: "shell-background-nohup", label: "基础：<code class=\"cmd\">nohup ./task.sh > /dev/null 2>&1 &</code>" },
                            { id: "shell-background-detail", label: "拆解：<code>nohup</code> 无视挂断信号；<code>> /dev/null</code> 标准输出丢黑洞；<code>2>&1</code> 错误也丢黑洞；<code>&</code> 后台运行。" },
                            { id: "shell-background-tmux", label: "高级：<code class=\"cmd\">tmux</code> 或 <code>screen</code>（退出SSH后重连，进程依然附着）。面试加分项。" }
                        ]
                    }
                ]
            },
            {
                id: "log-analysis",
                label: "5. 日志分析与文本处理（三板斧）",
                children: [
                    {
                        id: "log-awk",
                        label: "🔪 万能统计模型",
                        children: [
                            { id: "log-awk-template", label: "模板：<code class=\"cmd\">awk '{print $N}' | sort | uniq -c | sort -nr | head</code>" },
                            { id: "log-awk-step1", label: "步骤1：<code>awk</code> 取列（默认空格分隔，<code>-F</code> 指定分隔符）。" },
                            { id: "log-awk-step2", label: "步骤2：<code>sort</code> 排序，<code>uniq -c</code> 分组计数。" },
                            { id: "log-awk-step3", label: "步骤3：<code>sort -nr</code> 数字降序，<code>head</code> 取Top N。" },
                            { id: "log-awk-example", label: "例：统计非200状态码Top IP：<code>awk '$9 != 200 {print $1}' access.log | sort | uniq -c | sort -nr | head -1</code>" }
                        ]
                    },
                    {
                        id: "log-sed-grep",

// ============================================================
// 2. 渲染树 + 构建节点映射（用于搜索和引导）
// ============================================================
var nodeMap = {};  // id -> DOM元素 (li)
var nodePath = {}; // id -> 父级id数组（用于展开路径）

function renderTree(data, parentUl, parentIds) {
    parentIds = parentIds || [];
    data.forEach(function(item) {
        var li = document.createElement("li");
        li.dataset.id = item.id;
        var div = document.createElement("div");
        div.className = "node";

        var hasChildren = item.children && item.children.length > 0;

        var toggle = document.createElement("span");
        toggle.className = "toggle";
        toggle.textContent = hasChildren ? "▶" : "•";
        div.appendChild(toggle);

        var labelSpan = document.createElement("span");
        labelSpan.className = "label";
        labelSpan.innerHTML = item.label;
        div.appendChild(labelSpan);

        li.appendChild(div);

        // 存储节点信息
        nodeMap[item.id] = li;
        nodePath[item.id] = parentIds.concat(item.id);

        if (hasChildren) {
            var childUl = document.createElement("ul");
            childUl.className = "children";
            renderTree(item.children, childUl, nodePath[item.id]);
            li.appendChild(childUl);

            div.style.cursor = "pointer";
            div.addEventListener("click", function(e) {
                e.stopPropagation();
                var childContainer = this.parentElement.querySelector("ul.children");
                if (childContainer) {
                    childContainer.classList.toggle("open");
                    var toggleIcon = this.querySelector(".toggle");
                    toggleIcon.textContent = childContainer.classList.contains("open") ? "▼" : "▶";
                }
            });
        } else {
            li.classList.add("leaf");
        }

        parentUl.appendChild(li);
    });
}

// 展开一个节点及其所有父级路径
function expandToNode(nodeId) {
    var path = nodePath[nodeId];
    if (!path) return false;
    // 展开路径上的每个节点（即让它们的children容器为open）
    path.forEach(function(id) {
        var li = nodeMap[id];
        if (!li) return;
        var childUl = li.querySelector("ul.children");
        if (childUl) {
            childUl.classList.add("open");
            var toggle = li.querySelector(".node .toggle");
            if (toggle) toggle.textContent = "▼";
        }
    });
    // 滚动到目标节点
    var targetLi = nodeMap[nodeId];
    if (targetLi) {
        targetLi.scrollIntoView({ behavior: "smooth", block: "center" });
        // 加高亮
        targetLi.classList.add("highlight-node");
        setTimeout(function() {
            targetLi.classList.remove("highlight-node");
        }, 3000);
    }
    return true;
}

// 搜索函数
function searchNodes(query) {
    query = query.trim().toLowerCase();
    var resultInfo = document.getElementById("resultInfo");
    if (!query) {
        resultInfo.classList.remove("show");
        return;
    }
    var matches = [];
    for (var id in nodeMap) {
        var li = nodeMap[id];
        var text = li.textContent.toLowerCase();
        if (text.includes(query)) {
            matches.push(id);
        }
    }
    if (matches.length === 0) {
        resultInfo.textContent = "❌ 未找到包含 \"" + query + "\" 的节点";
        resultInfo.classList.add("show");
        return;
    }
    resultInfo.textContent = "✅ 找到 " + matches.length + " 个匹配节点，已展开第一个。";
    resultInfo.classList.add("show");
    // 展开第一个匹配
    expandToNode(matches[0]);
}

// ============================================================
// 3. 启动渲染
// ============================================================
document.addEventListener("DOMContentLoaded", function() {
    var rootUl = document.getElementById("knowledgeTree");
    renderTree(treeData, rootUl);

    // 默认展开第一层主分支
    document.querySelectorAll("#knowledgeTree > li > ul.children").forEach(function(ul) {
        ul.classList.add("open");
        var toggle = ul.parentElement.querySelector(".node .toggle");
        if (toggle) toggle.textContent = "▼";
    });

    // ---------- 搜索事件 ----------
    var searchInput = document.getElementById("searchInput");
    var searchBtn = document.getElementById("searchBtn");
    var clearBtn = document.getElementById("clearBtn");

    function doSearch() {
        searchNodes(searchInput.value);
    }

    searchBtn.addEventListener("click", doSearch);
    searchInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") doSearch();
    });
    clearBtn.addEventListener("click", function() {
        searchInput.value = "";
        document.getElementById("resultInfo").classList.remove("show");
        // 收起所有高亮
        document.querySelectorAll(".highlight-node").forEach(function(el) {
            el.classList.remove("highlight-node");
        });
    });

    // ---------- 快速引导链接 ----------
    var quickMap = {
        "load-high": "vmstat-b",
        "df-du-mismatch": "lsof-deleted-find",
        "fstab-emergency": "fstab-emergency-step1",
        "ss-recvq": "ss-recvq",
        "d-state": "ps-D",
        "shell-safe": "shell-set-standard",
        "security-group": "sg-troubleshoot",
        "cos-rclone": "cos-tools",
        "cache-breakdown": "cache-breakdown",
        "gray-release": "gray-flow"
    };

    document.querySelectorAll(".quick-links a").forEach(function(link) {
        link.addEventListener("click", function(e) {
            e.preventDefault();
            var targetId = this.dataset.target;
            var nodeId = quickMap[targetId];
            if (nodeId && nodeMap[nodeId]) {
                expandToNode(nodeId);
                // 在搜索框提示
                searchInput.value = "🔗 快速定位: " + this.textContent;
                document.getElementById("resultInfo").textContent = "已展开节点: " + this.textContent;
                document.getElementById("resultInfo").classList.add("show");
            } else {
                alert("未找到对应节点，请尝试搜索");
            }
        });
    });
});
