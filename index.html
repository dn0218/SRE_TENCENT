        .tree { padding-left: 0; list-style: none; }

            display: inline-block;

            text-align: center;

            font-weight: 700;

        .node .label {
            font-size: 15px;
            line-height: 1.7;

        }

        .highlight-node { background: #fef9c3 !important; border-radius: 8px; }

        .footer { margin-top: 32px; border-top: 1px solid #e2e8f0; padding-top: 18px; font-size: 13px; color: #94a3b8; text-align: center; }

</head>

<div class="container">
    <h1>🌳 SRE 终极知识树 · 排查 → 解决 → 预防</h1>

    <!-- 工具条 -->
    <div class="toolbar">
        <div class="search-area">
            <input type="text" id="searchInput" placeholder="搜索：如 load, lsof, 灰度, 缓存击穿" />

            <button class="clear-btn" id="clearBtn">✕ 清空</button>

        <div class="quick-links">

    <!-- 树容器 -->
    <ul class="tree" id="knowledgeTree"></ul>

<script>
// ============================================================
// 终极数据：每个故障场景 = 排查(怎么看) + 解决(怎么修) + 预防(怎么防)
// ============================================================
var treeData = [
    {
        id: "linux-root",
        label: "🐧 Linux 系统运维与排障（含解决方案）",
        children: [
            {
                id: "sys-obs",
                label: "1. 系统状态观测层",
                children: [
                    {
                        id: "top",
                        label: "📊 top（全局概览）",
                        children: [
                            { id: "top-load", label: "<strong>load average</strong>：1/5/15分钟平均活跃进程数（含运行态+不可中断睡眠）。" },
                            { id: "top-load-not-cpu", label: "⚠️ <span class=\"hl\">load ≠ CPU%</span>。单核 load=1.0 满载，load=5.0 严重拥堵。" },
                            { id: "top-us", label: "<strong>%us</strong>：用户态CPU（应用程序）。" },
                            { id: "top-sy", label: "<strong>%sy</strong>：内核态CPU（系统调用/中断）。" },
                            { id: "top-wa", label: "<span class=\"hl\">%wa</span>：CPU等待I/O占比。>10% → 磁盘/网络I/O瓶颈。" },
                            { id: "top-decision", label: "决策树：%wa高 → 查磁盘；%sy高且%id低 → 切 <code>vmstat</code> 看上下文切换。" }
                        ]
                    },
                    {
                        id: "vmstat",
                        label: "📈 vmstat 1（内核调度与内存）",
                        children: [
                            { id: "vmstat-r", label: "<strong>r（运行队列）</strong>：排队进程数。> CPU核数 = 超载。" },
                            { id: "vmstat-b", label: "<strong>b（阻塞进程）</strong>：>0 → I/O或锁竞争严重。" },
                            { id: "vmstat-si-so", label: "<strong>si/so（交换分区）</strong>：>0 且持续 = <span class=\"warn\">内存耗尽，硬盘当内存用，性能雪崩</span>。" },
                            { id: "vmstat-cs", label: "<strong>cs（上下文切换）</strong>：过高（>50万）→ 网卡中断暴增。" },
                            { id: "vmstat-cmd", label: "实战：<code>vmstat 1 5</code> 每秒输出，共5次。" }
                        ]
                    },
                    {
                        id: "iostat",
                        label: "💾 iostat -x 1（磁盘I/O细节）",
                        children: [
                            { id: "iostat-util", label: "<strong>%util</strong>：磁盘繁忙度。接近100% = <span class=\"hl\">磁盘打爆</span>。" },
                            { id: "iostat-await", label: "<strong>await</strong>：平均等待时间。 >20ms（机械盘）慢，云盘 >5ms 需关注。" },
                            { id: "iostat-decision", label: "关联：%util 100% + await 极高 → 磁盘瓶颈，优先查慢SQL或日志刷盘。" }
                        ]
                    },
                    {
                        id: "ss",
                        label: "🌐 ss -tlnp（网络与连接状态）",
                        children: [
                            { id: "ss-vs-netstat", label: "⭐ <code>ss</code> 直接读内核 <code>netlink</code>，比 <code>netstat</code> 读 /proc 快得多。" },
                            { id: "ss-recvq", label: "<strong>Recv-Q</strong>：已收未读字节。堆积 = 应用处理不过来（线程池满/卡顿）。" },
                            { id: "ss-sendq", label: "<strong>Send-Q</strong>：已发未确认。堆积 = 网络拥塞或对端窗口关闭。" },
                            { id: "ss-params", label: "常用：<code>-t</code> TCP, <code>-l</code> 监听, <code>-n</code> 数字, <code>-p</code> 显示进程PID。" },
                            { id: "ss-count", label: "排查：<code>ss -ant | grep -c CLOSE_WAIT</code> 统计异常连接。" }
                        ]
                    }
                ]
            },
            {
                id: "filesystem",
                label: "2. 文件系统与存储（含解决方案）",
                children: [
                    {
                        id: "inode",
                        label: "📁 Inode 原理",
                        children: [
                            { id: "inode-basic", label: "文件名=标签，数据在Inode。rm 撕标签（引用计数-1）。" },
                            { id: "inode-hardlink", label: "硬链接：同Inode多标签（不能跨分区）。删源数据仍在。" },
                            { id: "inode-softlink", label: "软链接：新Inode存路径（可跨分区）。删源即断链。" }
                        ]
                    },
                    {
                        id: "lsof-deleted",
                        label: "🕵️ df满但du小（空间失踪）",
                        children: [
                            { id: "lsof-deleted-find", label: "<span class=\"blue\">🔍 排查</span>：<code class=\"cmd\">lsof | grep deleted</code> 找出幽灵文件。" },
                            { id: "lsof-deleted-fix", label: "<span class=\"green\">✅ 解决</span>：<code class=\"cmd\">echo > /proc/[PID]/fd/[FD]</code> 或重启进程。⚠️ Java场景用 <code>kill -USR1</code> 重开日志，避免破坏 Buffer 偏移量。" },
                            { id: "lsof-deleted-prevent", label: "<span class=\"warn\">🛡️ 预防</span>：日志轮转用 <code>logrotate</code>（带 <code>copytruncate</code> 或 <code>create</code> 选项），避免句柄泄漏。" }
                        ]
                    },
                    {
                        id: "fstab-emergency",
                        label: "🚑 fstab 写错 · 紧急救援",
                        children: [
                            { id: "fstab-emergency-find", label: "<span class=\"blue\">🔍 排查</span>：系统进入 Emergency Mode，根只读(ro)。" },
                            { id: "fstab-emergency-fix", label: "<span class=\"green\">✅ 解决</span>：<code>mount -o remount,rw /</code> → 改 /etc/fstab → reboot。" },
                            { id: "fstab-emergency-grub", label: "进阶：GRUB2 加 <code>rd.break</code> 绕过密码进救援Shell（物理机/控制台=神）。" }
                        ]
                    }
                ]
            },
            {
                id: "process-state",
                label: "3. 进程与内核状态（含解决方案）",
                children: [
                    {
                        id: "ps-states",
                        label: "🧬 ps 进程状态全解",
                        children: [
                            { id: "ps-D", label: "<span class=\"hl\">D</span> (Disk Sleep)：不可中断睡眠（<strong>等I/O</strong>）。<span class=\"warn\">kill -9 杀不死</span>。" },
                            { id: "ps-D-fix", label: "<span class=\"green\">✅ 解决</span>：必须修复底层存储（重启NFS/等磁盘恢复）或重启宿主机。" },
                            { id: "ps-D-find", label: "<span class=\"blue\">🔍 排查</span>：<code class=\"cmd\">ps aux | grep D</code> 快速揪出I/O瓶颈进程。" },
                            { id: "ps-Z", label: "Z (Zombie)：子进程退出，父未回收。排查：<code>ps aux | grep Z</code>，找到父进程重启。" }
                        ]
                    }
                ]
            },
            {
                id: "shell-auto",
                label: "4. Shell 脚本与自动化（含解决方案）",
                children: [
                    {
                        id: "shell-set",
                        label: "🛡️ 调试与安全（set 家族）",
                        children: [
                            { id: "shell-set-x", label: "<code class=\"cmd\">set -x</code>：打印每行执行命令（调试利器）。" },
                            { id: "shell-set-e", label: "<code class=\"cmd\">set -e</code>：遇错即停。" },
                            { id: "shell-set-u", label: "<code class=\"cmd\">set -u</code>：防空变量（防 rm -rf $DIR 删根）。" },
                            { id: "shell-set-standard", label: "生产标配：<code class=\"cmd\">set -euo pipefail</code>" },
                            { id: "shell-set-trap", label: "替代调试：<code>trap 'echo \"Line: $LINENO, RC: $?\"' ERR</code>" }
                        ]
                    },
                    {
                        id: "shell-batch",
                        label: "🔄 批量操作与灰度",
                        children: [
                            { id: "shell-batch-loop", label: "批量修改：<code>for ip in $(cat hosts.txt); do ssh $ip \"cmd\"; done</code>" },
                            { id: "shell-batch-backup", label: "<span class=\"warn\">务必先备份</span>：<code>cp /etc/hosts /etc/hosts.bak</code>" },
                            { id: "shell-batch-gray", label: "灰度思维：先改10台，观察 <code>si/so</code>，5分钟后再扩。" }
                        ]
                    },
                    {
                        id: "shell-background",
                        label: "⏳ 后台保活",
                        children: [
                            { id: "shell-background-nohup", label: "基础：<code class=\"cmd\">nohup ./task.sh > /dev/null 2>&1 &</code>" },
                            { id: "shell-background-tmux", label: "高级：<code class=\"cmd\">tmux</code> 或 screen（退出SSH重连）。面试加分项。" }
                        ]
                    }
                ]
            },
            {
                id: "log-analysis",
                label: "5. 日志分析（三板斧）",
                children: [
                    {
                        id: "log-awk",
                        label: "🔪 awk 万能统计模型",
                        children: [
                            { id: "log-awk-template", label: "模板：<code class=\"cmd\">awk '{print $N}' | sort | uniq -c | sort -nr | head</code>" },
                            { id: "log-awk-example", label: "统计非200状态码Top IP：<code>awk '$9 != 200 {print $1}' access.log | sort | uniq -c | sort -nr | head -1</code>" }
                        ]
                    },
                    {
                        id: "log-sed-grep",
                        label: "✏️ sed & grep 速查",
                        children: [
                            { id: "log-sed", label: "<code>sed -i 's/old/new/g' file</code> 直接修改文件。" },
                            { id: "log-grep-c", label: "<code>grep -c</code> 只输出条数，不加则输出具体行。" }
                        ]
                    }
                ]
            },
            // ====== 新增：高频场景的“排查+解决+预防”闭环 ======
            {
                id: "cpu-high-scenario",
                label: "🔥 场景：CPU 使用率 95%（含完整方案）",
                children: [
                    { id: "cpu-high-find", label: "<span class=\"blue\">🔍 排查</span>：<code>top -c</code> 按 P 排序，找 CPU 占用最高的进程。" },
                    { id: "cpu-high-fix-business", label: "<span class=\"green\">✅ 解决（业务进程）</span>：<strong>先切流</strong>——从 CLB 摘除该机器（权重为0），玩家无感。再抓 <code>jstack</code>（Java）或 <code>perf top</code>（C++）分析。" },
                    { id: "cpu-high-fix-malware", label: "<span class=\"green\">✅ 解决（恶意进程如 xmrig）</span>：<code>kill -9 PID</code> → 查 <code>crontab -l</code> 删定时任务 → 查 <code>systemd</code> 删 service。" },
                    { id: "cpu-high-prevent", label: "<span class=\"warn\">🛡️ 预防</span>：增加 GC 时间监控；代码层面做 <code>@Async</code> 或限流 <code>Semaphore</code>；JVM 调优 <code>-XX:MaxGCPauseMillis</code>。" }
                ]
            },
            {
                id: "load-high-scenario",
                label: "⚡ 场景：Load 高但 CPU 低（I/O 瓶颈）",
                children: [
                    { id: "load-high-find", label: "<span class=\"blue\">🔍 排查</span>：<code>vmstat 1</code> 看 <code>b</code>（阻塞队列）和 <code>si/so</code>；<code>iostat -x 1</code> 看 <code>%util</code> 和 <code>await</code>。" },
                    { id: "load-high-fix", label: "<span class=\"green\">✅ 解决</span>：若 <code>%util</code> 100% → 查慢 SQL（加索引）或限制日志写入（<code>logrotate</code>）。若 <code>si/so</code> 高 → 扩容内存或迁移到更大规格 CVM。" },
                    { id: "load-high-prevent", label: "<span class=\"warn\">🛡️ 预防</span>：设置磁盘 <code>iops</code> 监控告警；数据库读写分离；缓存热点数据。" }
                ]
            },
            {
                id: "ss-recvq-scenario",
                label: "🌐 场景：Recv-Q 堆积",
                children: [
                    { id: "recvq-find", label: "<span class=\"blue\">🔍 排查</span>：<code>ss -tlnp</code> 看 Recv-Q 堆积数；查应用进程 <code>ulimit -n</code> 和线程池大小。" },

            {

// ============================================================
// 渲染 + 搜索 + 引导逻辑（与之前一致，已优化）
// ============================================================
var nodeMap = {};
var nodePath = {};

function renderTree(data, parentUl, parentIds) {
    parentIds = parentIds || [];
    data.forEach(function(item) {
        var li = document.createElement("li");
        li.dataset.id = item.id;
        var div = document.createElement("div");
        div.className = "node";

        var hasChildren = item.children && item.children.length > 0;
        var toggle = document.createElement("span");
        toggle.className = "toggle";
        toggle.textContent = hasChildren ? "▶" : "•";
        div.appendChild(toggle);

        var labelSpan = document.createElement("span");
        labelSpan.className = "label";
        labelSpan.innerHTML = item.label;
        div.appendChild(labelSpan);
        li.appendChild(div);

        nodeMap[item.id] = li;
        nodePath[item.id] = parentIds.concat(item.id);

        if (hasChildren) {
            var childUl = document.createElement("ul");
            childUl.className = "children";
            renderTree(item.children, childUl, nodePath[item.id]);
            li.appendChild(childUl);
            div.style.cursor = "pointer";
            div.addEventListener("click", function(e) {
                e.stopPropagation();
                var childContainer = this.parentElement.querySelector("ul.children");
                if (childContainer) {
                    childContainer.classList.toggle("open");
                    var toggleIcon = this.querySelector(".toggle");
                    toggleIcon.textContent = childContainer.classList.contains("open") ? "▼" : "▶";
                }
            });
        } else {
            li.classList.add("leaf");
        }
        parentUl.appendChild(li);
    });
}

function expandToNode(nodeId) {
    var path = nodePath[nodeId];
    if (!path) return false;
    path.forEach(function(id) {
        var li = nodeMap[id];
        if (!li) return;
        var childUl = li.querySelector("ul.children");
        if (childUl) {
            childUl.classList.add("open");
            var toggle = li.querySelector(".node .toggle");
            if (toggle) toggle.textContent = "▼";
        }
    });
    var targetLi = nodeMap[nodeId];
    if (targetLi) {
        targetLi.scrollIntoView({ behavior: "smooth", block: "center" });
        targetLi.classList.add("highlight-node");
        setTimeout(function() { targetLi.classList.remove("highlight-node"); }, 3000);
    }
    return true;
}

function searchNodes(query) {
    query = query.trim().toLowerCase();
    var resultInfo = document.getElementById("resultInfo");
    if (!query) { resultInfo.classList.remove("show"); return; }
    var matches = [];
    for (var id in nodeMap) {
        var li = nodeMap[id];
        var text = li.textContent.toLowerCase();
        if (text.includes(query)) matches.push(id);
    }
    if (matches.length === 0) {
        resultInfo.textContent = "❌ 未找到包含 \"" + query + "\" 的节点";
        resultInfo.classList.add("show");
        return;
    }
    resultInfo.textContent = "✅ 找到 " + matches.length + " 个匹配节点，已展开第一个。";
    resultInfo.classList.add("show");
    expandToNode(matches[0]);
}

document.addEventListener("DOMContentLoaded", function() {
    var rootUl = document.getElementById("knowledgeTree");
    renderTree(treeData, rootUl);

    // 默认展开第一层
    document.querySelectorAll("#knowledgeTree > li > ul.children").forEach(function(ul) {
        ul.classList.add("open");
        var toggle = ul.parentElement.querySelector(".node .toggle");
        if (toggle) toggle.textContent = "▼";
    });

    // 搜索
    document.getElementById("searchBtn").addEventListener("click", function() { searchNodes(document.getElementById("searchInput").value); });
    document.getElementById("searchInput").addEventListener("keydown", function(e) { if (e.key === "Enter") searchNodes(this.value); });
    document.getElementById("clearBtn").addEventListener("click", function() {
        document.getElementById("searchInput").value = "";
        document.getElementById("resultInfo").classList.remove("show");
        document.querySelectorAll(".highlight-node").forEach(function(el) { el.classList.remove("highlight-node"); });
    });

    // 快速引导映射
    var quickMap = {
        "cpu-high": "cpu-high-fix-business",
        "load-high": "load-high-find",
        "df-du-mismatch": "lsof-deleted-fix",
        "fstab-emergency": "fstab-emergency-fix",
        "ss-recvq": "recvq-fix",
        "d-state": "ps-D-fix",
        "shell-safe": "shell-set-standard",
        "security-group": "sg-fix",
        "cos-rclone": "cos-example",
        "cache-breakdown": "cache-breakdown",
        "gray-release": "gray-flow",
        "pod-crash": "pod-crash-fix"
    };
    document.querySelectorAll(".quick-links a").forEach(function(link) {
        link.addEventListener("click", function(e) {
            e.preventDefault();
            var targetId = this.dataset.target;
            var nodeId = quickMap[targetId];
            if (nodeId && nodeMap[nodeId]) {
                expandToNode(nodeId);
                document.getElementById("searchInput").value = "🔗 " + this.textContent;
                document.getElementById("resultInfo").textContent = "已展开 " + this.textContent + " 的解决方案";
                document.getElementById("resultInfo").classList.add("show");
            }
        });
    });
});
