            text-align: center;

            background: #e2e8f0;
            padding: 0 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            color: #475569;
            margin-left: 8px;
            letter-spacing: 0.3px;
        }

            border-radius: 6px;

            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

            background: #fee2e2;
            color: #991b1b;
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        }
        .children.open {

        .leaf .node {
            cursor: default;
        }
        .leaf .node:hover {
            background: transparent;
        }
        .leaf .node .toggle {
            visibility: hidden;
        }
        .footer {
            margin-top: 32px;

            padding-top: 18px;
            font-size: 13px;

</head>

                                { label: '服务账号（Service Account）= 给程序用的“机器人账号”（类比 <code>nobody</code> 用户）。' }
                            ]
                        }
                    ]
                },
                // ========== 3. 容器 ==========
                {

                    children: [

                                { label: 'TKE = 腾讯云托管 Kubernetes 服务，底层Worker节点是 CVM，仍可用 <code>kubectl</code> 管理。' }
                            ]
                        },
                        {
                            label: '🔄 灰度发布策略（必考）',
                            children: [
                                { label: '流程：1% 金丝雀 → 观察 <code>si/so</code>、<code>%util</code>、业务错误率（10分钟） → 10% → 全量。' },
                                { label: '铁律：<span class="hl">先切流（CLB摘除），再重启/变更</span>，避免影响玩家。' },

                {

                                { label: '<span class="hl">击穿</span>：热点Key过期，百万请求直冲DB。解法：<code>SETNX</code> 分布式锁（抢到锁的查DB，其余等待）。' },
                                { label: '<strong>穿透</strong>：查询不存在的数据（如恶意ID）。解法：布隆过滤器 或 缓存空值。' },

        }

    // ============================================================
    // 递归渲染（支持展开/收起）
    // ============================================================
    function renderTree(data, parentUl) {
        data.forEach(item => {
            const li = document.createElement('li');
            const div = document.createElement('div');
            div.className = 'node';

            const hasChildren = item.children && item.children.length > 0;

            const toggle = document.createElement('span');
            toggle.className = 'toggle';
            toggle.textContent = hasChildren ? '▶' : '•';
            div.appendChild(toggle);

            const labelSpan = document.createElement('span');
            labelSpan.className = 'label';
            labelSpan.innerHTML = item.label;
            div.appendChild(labelSpan);

            li.appendChild(div);

            if (hasChildren) {
                const childUl = document.createElement('ul');
                childUl.className = 'children';
                renderTree(item.children, childUl);
                li.appendChild(childUl);

                div.style.cursor = 'pointer';
                div.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const childContainer = this.parentElement.querySelector('ul.children');
                    if (childContainer) {
                        childContainer.classList.toggle('open');
                        const toggleIcon = this.querySelector('.toggle');
                        toggleIcon.textContent = childContainer.classList.contains('open') ? '▼' : '▶';
                    }
                });
            } else {
                li.classList.add('leaf');
            }

            parentUl.appendChild(li);
        });
    }

    const rootUl = document.getElementById('knowledgeTree');
    renderTree(treeData, rootUl);

    // 默认展开第一层主分支（Linux 和 Cloud），方便概览
    document.querySelectorAll('#knowledgeTree > li > ul.children').forEach(ul => {
        ul.classList.add('open');
        const toggle = ul.parentElement.querySelector('.node .toggle');
        if (toggle) toggle.textContent = '▼';
    });
</script>
