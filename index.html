var treeData = [
    {

                            { id: "vmstat-b", label: "<strong>b（阻塞进程）</strong>：>0 → I/O或锁竞争严重。" },
                            { id: "vmstat-si-so", label: "<strong>si/so（交换分区）</strong>：>0 且持续 = <span class=\"warn\">内存耗尽，硬盘当内存用，性能雪崩</span>。" },
                            { id: "vmstat-cs", label: "<strong>cs（上下文切换）</strong>：过高（>50万）→ 网卡中断暴增。" },
                            { id: "vmstat-cmd", label: "实战：<code>vmstat 1 5</code> 每秒输出，共5次。" },
                            { id: "vmstat-principle", label: "⚙️ 原理深挖：<code>si/so</code> 是内存换页（paging）和交换（swapping）的直接表现，当物理内存不足时，内核会启动 <code>kswapd</code> 线程将不常用页换出到 swap 分区，这个过程会大量消耗磁盘 I/O，导致系统响应急剧下降。" }

                    {
                        id: "iostat",
                        label: "💾 iostat -x 1（磁盘I/O细节）",

                            { id: "iostat-decision", label: "关联：%util 100% + await 极高 → 磁盘瓶颈，优先查慢SQL或日志刷盘。" },
                            { id: "iostat-principle", label: "⚙️ 原理深挖：<code>%util</code> 是磁盘处理 I/O 请求的时间占比，不包括等待时间。而 <code>await</code> 包含了排队 + 服务时间，所以 <code>await</code> 高但 <code>%util</code> 不高，说明磁盘本身不忙，但 I/O 调度器排队严重，可能是系统整体负载高导致。" }

                    },

                        label: "🌐 ss -tlnp（网络与连接状态）",

                            { id: "ss-recvq", label: "<strong>Recv-Q</strong>：已收未读字节。堆积 = 应用处理不过来（线程池满/卡顿）。" },
                            { id: "ss-sendq", label: "<strong>Send-Q</strong>：已发未确认。堆积 = 网络拥塞或对端窗口关闭。" },
                            { id: "ss-params", label: "常用：<code>-t</code> TCP, <code>-l</code> 监听, <code>-n</code> 数字, <code>-p</code> 显示进程PID。" },
                            { id: "ss-principle", label: "⚙️ 原理深挖：Recv-Q 是 TCP 接收缓冲区（sk_rmem）中尚未被应用程序读取的数据量。如果 Recv-Q 长期非零且持续增长，说明应用程序调用 <code>recv()</code> 的速度赶不上内核接收包的速度，可能的原因是应用线程被阻塞（如等待锁、GC）或系统调用开销过大。" }

                    { id: "alert-fatigue-principle", label: "⚙️ 原理深挖：告警疲劳的根本原因是 <strong>告警规则设计不合理</strong>，例如阈值过低或基于瞬时值而不是趋势。Google SRE 推荐使用 <strong>错误预算（Error Budget）</strong> 概念：只有在错误预算即将耗尽时才触发告警。例如，对于 <strong>99.9%</strong> 可用性目标，可以在季度错误预算（0.1%）用完一半时开始告警。此外，应使用 <strong>多级告警</strong>（Warning → Critical）和 <strong>抑制（抑制告警风暴）</strong> 机制。" }
                ]
            },
            {
                id: "latency-spike",
                label: "⏱️ 延迟从 100ms 飙升到 5 秒（完整排查流程）",
                children: [
                    { id: "latency-find", label: "<span class=\"blue\">🔍 排查</span>：先看 CLB 监控确认是单区域还是全量；登录后端机器执行 <code>top</code>、<code>iostat -x 1</code>、<code>ss -tlnp</code>；查看 <code>slow.log</code>（数据库慢查询）和 GC 日志。" },
                    { id: "latency-fix", label: "<span class=\"green\">✅ 解决</span>：若磁盘 <code>%util</code> 高 → 查慢 SQL 加索引；若 GC 频繁 → 调整 JVM 堆大小或 dump 分析；若网络 Recv-Q 堆积 → 扩容线程池或增加实例。" },
                    { id: "latency-prevent", label: "<span class=\"warn\">🛡️ 预防</span>：增加 P99 延迟监控告警；设置 <code>HPA</code> 自动扩容；定期压测并优化代码。" },
                    { id: "latency-principle", label: "⚙️ 原理深挖：延迟飙升通常由资源争用（CPU/磁盘/网络）或代码同步阻塞（锁/GC）引起。排查应遵循漏斗原则：从 LB → 应用 → 中间件（Redis/DB） → 代码堆栈。使用 <code>分布式跟踪（如 Jaeger）</code> 能快速定位慢调用的上下游，比逐层查日志更高效。" }
                ]
            }
        ]
    }
];

// ============================================================
// 渲染 + 搜索 + 引导逻辑（与之前一致）
// ============================================================
var nodeMap = {};
var nodePath = {};

function renderTree(data, parentUl, parentIds) {
    parentIds = parentIds || [];
    data.forEach(function(item) {
        var li = document.createElement("li");
        li.dataset.id = item.id;
        var div = document.createElement("div");
        div.className = "node";

        var hasChildren = item.children && item.children.length > 0;
        var toggle = document.createElement("span");
        toggle.className = "toggle";
        toggle.textContent = hasChildren ? "▶" : "•";
        div.appendChild(toggle);

        var labelSpan = document.createElement("span");
        labelSpan.className = "label";
        labelSpan.innerHTML = item.label;
        div.appendChild(labelSpan);
        li.appendChild(div);

        nodeMap[item.id] = li;
        nodePath[item.id] = parentIds.concat(item.id);

        if (hasChildren) {
            var childUl = document.createElement("ul");
            childUl.className = "children";
            renderTree(item.children, childUl, nodePath[item.id]);
            li.appendChild(childUl);
            div.style.cursor = "pointer";
            div.addEventListener("click", function(e) {
                e.stopPropagation();
                var childContainer = this.parentElement.querySelector("ul.children");
                if (childContainer) {
                    childContainer.classList.toggle("open");
                    var toggleIcon = this.querySelector(".toggle");
                    toggleIcon.textContent = childContainer.classList.contains("open") ? "▼" : "▶";
                }
            });
        } else {
            li.classList.add("leaf");
        }
        parentUl.appendChild(li);
    });
}

function expandToNode(nodeId) {
    var path = nodePath[nodeId];
    if (!path) return false;
    path.forEach(function(id) {
        var li = nodeMap[id];
        if (!li) return;
        var childUl = li.querySelector("ul.children");
        if (childUl) {
            childUl.classList.add("open");
            var toggle = li.querySelector(".node .toggle");
            if (toggle) toggle.textContent = "▼";
        }
    });
    var targetLi = nodeMap[nodeId];
    if (targetLi) {
        targetLi.scrollIntoView({ behavior: "smooth", block: "center" });
        targetLi.classList.add("highlight-node");
        setTimeout(function() { targetLi.classList.remove("highlight-node"); }, 3000);
    }
    return true;
}

function searchNodes(query) {
    query = query.trim().toLowerCase();
    var resultInfo = document.getElementById("resultInfo");
    if (!query) { resultInfo.classList.remove("show"); return; }
    var matches = [];
    for (var id in nodeMap) {
        var li = nodeMap[id];
        var text = li.textContent.toLowerCase();
        if (text.includes(query)) matches.push(id);
    }
    if (matches.length === 0) {
        resultInfo.textContent = "❌ 未找到包含 \"" + query + "\" 的节点";
        resultInfo.classList.add("show");
        return;
    }
    resultInfo.textContent = "✅ 找到 " + matches.length + " 个匹配节点，已展开第一个。";
    resultInfo.classList.add("show");
    expandToNode(matches[0]);
}

document.addEventListener("DOMContentLoaded", function() {
    var rootUl = document.getElementById("knowledgeTree");
    renderTree(treeData, rootUl);

    // 默认展开第一层
    document.querySelectorAll("#knowledgeTree > li > ul.children").forEach(function(ul) {
        ul.classList.add("open");
        var toggle = ul.parentElement.querySelector(".node .toggle");
        if (toggle) toggle.textContent = "▼";
    });

    // 搜索
    document.getElementById("searchBtn").addEventListener("click", function() { searchNodes(document.getElementById("searchInput").value); });
    document.getElementById("searchInput").addEventListener("keydown", function(e) { if (e.key === "Enter") searchNodes(this.value); });
    document.getElementById("clearBtn").addEventListener("click", function() {
        document.getElementById("searchInput").value = "";
        document.getElementById("resultInfo").classList.remove("show");
        document.querySelectorAll(".highlight-node").forEach(function(el) { el.classList.remove("highlight-node"); });
    });

    // 快速链接映射（18个）
    var quickMap = {
        "cpu-high": "cpu-high-fix-business",
        "load-high": "load-high-find",
        "df-du-mismatch": "lsof-deleted-fix",
        "fstab-emergency": "fstab-emergency-fix",
        "ss-recvq": "recvq-fix",
        "d-state": "ps-D-fix",
        "shell-safe": "shell-set-standard",
        "security-group": "sg-fix",
        "cos-rclone": "cos-example",
        "cache-breakdown": "cache-breakdown",
        "gray-release": "gray-flow",
        "pod-crash": "pod-crash-fix",
        "pod-pending": "pending-fix",
        "tcp-udp": "tcp-udp-principle",
        "lb-importance": "lb-principle",
        "monitor-metrics": "monitor-metrics-principle",
        "alert-fatigue": "alert-fatigue-principle",
        "latency-spike": "latency-fix"
    };
    document.querySelectorAll(".quick-links a").forEach(function(link) {
        link.addEventListener("click", function(e) {
            e.preventDefault();
            var targetId = this.dataset.target;
            var nodeId = quickMap[targetId];
            if (nodeId && nodeMap[nodeId]) {
                expandToNode(nodeId);
                document.getElementById("searchInput").value = "🔗 " + this.textContent;
                document.getElementById("resultInfo").textContent = "已展开 " + this.textContent + " 的详细方案或原理";
                document.getElementById("resultInfo").classList.add("show");
            }
        });
    });
});
</script>
